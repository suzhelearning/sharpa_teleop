# `pixi run manus` starts native-rate capture and official IPOPT retargeting.
# `pixi run real [left|right]` starts only sharpa_output, which consumes direct retarget commands.
# Manus SDK/calibration and worker settings, plus real output lifecycle and serial settings, are launch arguments.
# Parameters are read at startup; restart nodes after changing this file.
sharpa_output:
  ros__parameters:
    dry_run: true
    left_serial: ""
    right_serial: ""
    # The YAML default is conservative; `pixi run real` overrides this to true.
    # It auto-arms only once after valid selected-side targets; disable or fault cancels it.
    auto_enable: false
    # On Ctrl+C/SIGTERM only, a healthy armed real output homes selected joints before disabling.
    return_to_zero_on_exit: false
    # Measured all-zero convergence must fit these bounds; failure skips further motion and disables.
    homing_timeout_sec: 10.0
    homing_tolerance_rad: 0.02
    future_tolerance_sec: 0.0
    smoothing_time_sec: 0.02  # exponential time constant; no velocity limit or input watchdog
    control_hz: 500.0
    feedback_hz: 30.0
    startup_timeout_sec: 5.0
